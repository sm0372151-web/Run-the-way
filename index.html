<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUNING - Endless Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#050816;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:500px;
    overflow:hidden;
    background:
      linear-gradient(#07152f 0%,#123b67 50%,#1e6b79 75%,#12291e 100%);
}

/* SKY */

.moon{
    position:absolute;
    width:90px;
    height:90px;
    right:9%;
    top:8%;
    border-radius:50%;
    background:#fff7c7;
    box-shadow:
      0 0 25px #fff5a8,
      0 0 70px rgba(255,245,168,.35);
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.25}
    to{opacity:1}
}

/* CLOUDS */

.cloud{
    position:absolute;
    width:150px;
    height:45px;
    background:rgba(255,255,255,.14);
    border-radius:50px;
    filter:blur(1px);
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud:before{
    width:65px;
    height:65px;
    left:25px;
    top:-28px;
}

.cloud:after{
    width:75px;
    height:75px;
    right:20px;
    top:-35px;
}

.cloud1{
    top:17%;
    left:-180px;
    animation:cloudMove 25s linear infinite;
}

.cloud2{
    top:28%;
    left:-300px;
    transform:scale(.7);
    animation:cloudMove 35s linear infinite;
}

@keyframes cloudMove{
    to{left:110%}
}

/* MOUNTAINS */

.mountains{
    position:absolute;
    bottom:115px;
    width:100%;
    height:240px;
    background:
      linear-gradient(135deg,transparent 48%,#12334a 49% 65%,transparent 66%) 0 0/230px 220px repeat-x;
    opacity:.9;
}

/* TREES */

.treeLayer{
    position:absolute;
    bottom:82px;
    width:200%;
    height:150px;
    display:flex;
    gap:45px;
    align-items:flex-end;
    animation:trees 12s linear infinite;
}

.tree{
    width:0;
    height:0;
    border-left:28px solid transparent;
    border-right:28px solid transparent;
    border-bottom:90px solid #092b27;
    position:relative;
}

.tree:after{
    content:"";
    position:absolute;
    left:-4px;
    top:85px;
    width:8px;
    height:45px;
    background:#271b12;
}

@keyframes trees{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
}

/* GROUND */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:115px;
    background:#152719;
    border-top:5px solid #50e36b;
}

.road{
    position:absolute;
    top:24px;
    left:0;
    width:200%;
    height:6px;
    background:repeating-linear-gradient(
      90deg,
      #d4ff89 0 55px,
      transparent 55px 105px
    );
    animation:roadMove .65s linear infinite;
}

@keyframes roadMove{
    to{transform:translateX(-105px)}
}

/* HUD */

#hud{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.stat{
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.18);
    padding:9px 15px;
    border-radius:15px;
    color:white;
    font-weight:bold;
    backdrop-filter:blur(8px);
    text-shadow:0 2px 5px #000;
}

#pauseBtn{
    pointer-events:auto;
    border:0;
    cursor:pointer;
    background:rgba(255,255,255,.15);
    color:white;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:20px;
}

/* PLAYER */

#player{
    position:absolute;
    left:14%;
    bottom:115px;
    width:48px;
    height:75px;
    z-index:10;
    transition:transform .08s;
}

.head{
    position:absolute;
    width:34px;
    height:34px;
    left:7px;
    top:0;
    background:#ffd0a6;
    border-radius:50%;
    border:3px solid #171717;
}

.hair{
    position:absolute;
    left:7px;
    top:-3px;
    width:34px;
    height:17px;
    background:#18131c;
    border-radius:20px 20px 5px 5px;
    z-index:2;
}

.body{
    position:absolute;
    left:9px;
    top:31px;
    width:30px;
    height:32px;
    background:linear-gradient(135deg,#20e3a2,#00a7ff);
    border-radius:10px 10px 7px 7px;
}

.arm{
    position:absolute;
    width:9px;
    height:27px;
    background:#ffd0a6;
    border:2px solid #171717;
    border-radius:10px;
    top:34px;
}

.arm1{
    left:2px;
    transform:rotate(35deg);
}

.arm2{
    right:2px;
    transform:rotate(-35deg);
}

.leg{
    position:absolute;
    width:10px;
    height:28px;
    background:#253b83;
    border-radius:8px;
    top:59px;
}

.leg1{
    left:10px;
    transform:rotate(20deg);
}

.leg2{
    right:10px;
    transform:rotate(-20deg);
}

.shoe{
    position:absolute;
    width:20px;
    height:8px;
    background:#fff;
    border-radius:10px;
}

.shoe1{
    left:3px;
    top:82px;
}

.shoe2{
    right:3px;
    top:82px;
}

.running{
    animation:run .18s infinite alternate;
}

@keyframes run{
    from{transform:translateY(0)}
    to{transform:translateY(-5px)}
}

/* OBSTACLE */

.obstacle{
    position:absolute;
    bottom:115px;
    width:42px;
    height:62px;
    z-index:9;
    border-radius:8px 8px 3px 3px;
    background:
      linear-gradient(135deg,#ff416c,#8b1538);
    border:3px solid #ff8ca5;
    box-shadow:0 0 15px rgba(255,30,80,.5);
}

.obstacle:before{
    content:"";
    position:absolute;
    top:-17px;
    left:8px;
    width:20px;
    height:20px;
    background:#ff416c;
    transform:rotate(45deg);
    border-radius:4px;
}

/* COIN */

.coin{
    position:absolute;
    bottom:210px;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#ffd83d;
    border:4px solid #fff1a2;
    box-shadow:0 0 18px #ffd83d;
    z-index:8;
    animation:coinSpin .55s linear infinite;
}

@keyframes coinSpin{
    0%{transform:rotateY(0)}
    50%{transform:rotateY(180deg) scale(.7)}
    100%{transform:rotateY(360deg)}
}

/* SCREENS */

.screen{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:rgba(2,7,20,.72);
    backdrop-filter:blur(7px);
}

.panel{
    width:min(90%,440px);
    padding:35px 25px;
    border-radius:30px;
    background:rgba(9,20,42,.9);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    color:white;
}

.logo{
    font-size:clamp(50px,12vw,85px);
    font-weight:1000;
    letter-spacing:8px;
    color:#55ff8b;
    text-shadow:
      0 0 10px #55ff8b,
      0 0 35px rgba(85,255,139,.5);
}

.subtitle{
    color:#a8bfd9;
    margin:8px 0 25px;
}

button.play{
    border:0;
    padding:16px 50px;
    border-radius:50px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    color:#03120a;
    background:#55ff8b;
    box-shadow:0 0 25px rgba(85,255,139,.45);
}

button.play:active{
    transform:scale(.95);
}

.controls{
    margin-top:22px;
    color:#91a8c2;
    font-size:14px;
    line-height:1.7;
}

.hidden{
    display:none!important;
}

/* MOBILE */

#jumpBtn{
    position:absolute;
    z-index:30;
    right:25px;
    bottom:25px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.5);
    background:rgba(85,255,139,.22);
    color:white;
    font-weight:bold;
    font-size:15px;
    backdrop-filter:blur(8px);
}

#jumpBtn:active{
    transform:scale(.9);
}

@media(max-width:600px){
    #game{
        min-height:100vh;
    }

    .moon{
        width:65px;
        height:65px;
    }

    #player{
        left:17%;
    }

    .stat{
        padding:7px 10px;
        font-size:13px;
    }

    #hud{
        top:12px;
        left:10px;
        right:10px;
    }

    .ground{
        height:100px;
    }

    #player,
    .obstacle{
        bottom:100px;
    }

    .treeLayer{
        bottom:68px;
    }

    .mountains{
        bottom:100px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- SKY -->
    <div class="moon"></div>

    <div class="star" style="left:8%;top:12%"></div>
    <div class="star" style="left:20%;top:20%"></div>
    <div class="star" style="left:35%;top:10%"></div>
    <div class="star" style="left:50%;top:18%"></div>
    <div class="star" style="left:65%;top:8%"></div>
    <div class="star" style="left:80%;top:24%"></div>
    <div class="star" style="left:90%;top:13%"></div>
    <div class="star" style="left:45%;top:30%"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="mountains"></div>

    <div class="treeLayer">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="stat">🏆 <span id="score">0</span></div>
        <div class="stat">🪙 <span id="coins">0</span></div>
        <div class="stat">⭐ <span id="best">0</span></div>
        <button id="pauseBtn">Ⅱ</button>
    </div>

    <!-- PLAYER -->
    <div id="player" class="running">
        <div class="hair"></div>
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm arm1"></div>
        <div class="arm arm2"></div>
        <div class="leg leg1"></div>
        <div class="leg leg2"></div>
        <div class="shoe shoe1"></div>
        <div class="shoe shoe2"></div>
    </div>

    <!-- GROUND -->
    <div class="ground">
        <div class="road"></div>
    </div>

    <!-- MOBILE BUTTON -->
    <button id="jumpBtn">JUMP</button>

    <!-- START SCREEN -->
    <div id="startScreen" class="screen">
        <div class="panel">
            <div class="logo">RUNING</div>
            <div class="subtitle">THE ENDLESS RUNNER</div>

            <button class="play" id="startBtn">▶ PLAY NOW</button>

            <div class="controls">
                🖥️ Space / ↑ = Jump<br>
                📱 Tap JUMP = Jump<br>
                🪙 Collect coins and survive!
            </div>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver" class="screen hidden">
        <div class="panel">
            <div style="font-size:45px">💥</div>
            <h1 style="margin:10px 0">GAME OVER</h1>

            <p style="color:#9fb4ca">
                Your Score
            </p>

            <div id="finalScore"
                 style="font-size:55px;font-weight:bold;color:#55ff8b">
                0
            </div>

            <p style="margin:8px 0 22px;color:#ffd83d">
                🪙 <span id="finalCoins">0</span> coins
            </p>

            <button class="play" id="restartBtn">
                ↻ PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- PAUSE -->
    <div id="pauseScreen" class="screen hidden">
        <div class="panel">
            <div style="font-size:50px">Ⅱ</div>
            <h1>PAUSED</h1>
            <br>
            <button class="play" id="resumeBtn">
                ▶ RESUME
            </button>
        </div>
    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const bestEl = document.getElementById("best");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");
const pauseScreen = document.getElementById("pauseScreen");
const hud = document.getElementById("hud");

const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");

const jumpBtn = document.getElementById("jumpBtn");
const pauseBtn = document.getElementById("pauseBtn");

let playing = false;
let paused = false;

let score = 0;
let coins = 0;
let best = Number(localStorage.getItem("RUNING_BEST") || 0);

let playerY = 0;
let velocityY = 0;
let jumps = 0;

let speed = 6;
let obstacleTimer = 0;
let coinTimer = 0;
let lastTime = 0;

bestEl.textContent = best;


/* SOUND */

let audioCtx;

function sound(type){

    try{

        if(!audioCtx){
            audioCtx = new
            (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if(type === "jump"){
            osc.frequency.value = 500;
        }

        if(type === "coin"){
            osc.frequency.value = 850;
        }

        if(type === "hit"){
            osc.frequency.value = 100;
        }

        gain.gain.setValueAtTime(.08,audioCtx.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime + .12
        );

        osc.start();
        osc.stop(audioCtx.currentTime + .12);

    }catch(e){}
}


/* START */

function startGame(){

    score = 0;
    coins = 0;

    speed = 6;

    playerY = 0;
    velocityY = 0;
    jumps = 0;

    scoreEl.textContent = 0;
    coinsEl.textContent = 0;

    document.querySelectorAll(".obstacle,.coin")
        .forEach(e => e.remove());

    startScreen.classList.add("hidden");
    gameOver.classList.add("hidden");
    pauseScreen.classList.add("hidden");

    hud.classList.remove("hidden");

    playing = true;
    paused = false;

    lastTime = performance.now();

    requestAnimationFrame(loop);
}


/* JUMP */

function jump(){

    if(!playing || paused) return;

    if(jumps < 2){

        velocityY = 13;
        jumps++;

        sound("jump");

        player.classList.remove("running");

        setTimeout(()=>{
            if(playing)
                player.classList.add("running");
        },200);
    }
}


/* KEYBOARD */

document.addEventListener("keydown",e=>{

    if(
        e.code === "Space" ||
        e.code === "ArrowUp"
    ){
        e.preventDefault();
        jump();
    }

    if(e.code === "Escape"){
        togglePause();
    }
});


/* TOUCH */

jumpBtn.addEventListener("touchstart",e=>{
    e.preventDefault();
    jump();
});

jumpBtn.addEventListener("click",jump);


/* PAUSE */

function togglePause(){

    if(!playing) return;

    paused = !paused;

    if(paused){

        pauseScreen.classList.remove("hidden");

    }else{

        pauseScreen.classList.add("hidden");
        lastTime = performance.now();

        requestAnimationFrame(loop);
    }
}

pauseBtn.addEventListener("click",togglePause);

document.getElementById("resumeBtn")
    .addEventListener("click",togglePause);


/* CREATE OBSTACLE */

function createObstacle(){

    const obstacle = document.createElement("div");

    obstacle.className = "obstacle";

    obstacle.style.left =
        game.clientWidth + "px";

    game.appendChild(obstacle);

}


/* CREATE COIN */

function createCoin(){

    const coin = document.createElement("div");

    coin.className = "coin";

    coin.style.left =
        game.clientWidth + "px";

    const heights = [170,220,275];

    coin.style.bottom =
        heights[Math.floor(Math.random()*heights.length)]
        + "px";

    game.appendChild(coin);
}


/* COLLISION */

function collision(a,b){

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
        r1.right < r2.left + 7 ||
        r1.left + 7 > r2.right ||
        r1.bottom - 8 < r2.top ||
        r1.top + 8 > r2.bottom
    );
}


/* GAME OVER */

function endGame(){

    playing = false;

    sound("hit");

    if(score > best){

        best = score;

        localStorage.setItem(
            "RUNING_BEST",
            best
        );

        bestEl.textContent = best;
    }

    finalScore.textContent = score;
    finalCoins.textContent = coins;

    gameOver.classList.remove("hidden");
}


/* MAIN LOOP */

function loop(time){

    if(!playing || paused) return;

    const dt = Math.min(
        (time - lastTime) / 16.67,
        2
    );

    lastTime = time;

    /* PLAYER PHYSICS */

    velocityY -= .7 * dt;

    playerY += velocityY * dt;

    if(playerY <= 0){

        playerY = 0;
        velocityY = 0;
        jumps = 0;
    }

    player.style.bottom =
        (115 + playerY) + "px";


    /* SPEED */

    speed =
        6 + Math.floor(score / 100) * .8;


    /* OBSTACLES */

    obstacleTimer += dt;

    if(obstacleTimer > Math.max(55,105 - speed*4)){

        obstacleTimer = 0;

        createObstacle();
    }


    /* COINS */

    coinTimer += dt;

    if(coinTimer > 75){

        coinTimer = 0;

        createCoin();
    }


    /* MOVE OBJECTS */

    document
    .querySelectorAll(".obstacle")
    .forEach(ob=>{

        let x =
            parseFloat(ob.style.left);

        x -= speed * dt;

        ob.style.left = x + "px";


        if(collision(player,ob)){

            endGame();
        }

        if(x < -70){

            ob.remove();

            score++;

            scoreEl.textContent = score;
        }
    });


    document
    .querySelectorAll(".coin")
    .forEach(c=>{

        let x =
            parseFloat(c.style.left);

        x -= speed * dt;

        c.style.left = x + "px";


        if(collision(player,c)){

            coins++;

            score += 5;

            coinsEl.textContent = coins;
            scoreEl.textContent = score;

            sound("coin");

            c.remove();
        }

        else if(x < -60){

            c.remove();
        }
    });


    requestAnimationFrame(loop);
}


/* BUTTONS */

document
.getElementById("startBtn")
.addEventListener("click",startGame);

document
.getElementById("restartBtn")
.addEventListener("click",startGame);


/* INITIAL PLAYER */

player.style.bottom = "115px";

</script>

</body>
</html>
