<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Ludo 6 Players</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#151515;
    color:#fff;
    min-height:100vh;
    padding:15px;
}

.game{
    width:min(850px,100%);
    margin:auto;
    text-align:center;
}

h1{
    font-size:32px;
    margin:8px 0;
}

.subtitle{
    color:#bbb;
    margin-bottom:14px;
}

.setup{
    background:#242424;
    padding:14px;
    border-radius:14px;
    margin-bottom:14px;
}

.setup-title{
    font-size:18px;
    margin-bottom:10px;
}

.player-select{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
}

.player-select button{
    border:0;
    padding:9px 14px;
    border-radius:8px;
    background:#444;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.player-select button.active{
    background:#16a34a;
}

.start{
    margin-top:10px;
    border:0;
    padding:11px 25px;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* GAME INFO */

.info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.info span{
    background:#292929;
    padding:8px 15px;
    border-radius:8px;
}

#turn{
    font-weight:bold;
}

/* BOARD */

.board{
    width:min(720px,96vw);
    aspect-ratio:1/1;
    margin:auto;
    position:relative;
    background:#f5f5f5;
    border:7px solid #111;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 12px 35px #000;
}

/* HOME BASES */

.base{
    position:absolute;
    width:29%;
    height:29%;
    border:5px solid #111;
    border-radius:12px;
    padding:8px;
    z-index:2;
}

.base-title{
    color:white;
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
    text-shadow:1px 1px 2px #000;
}

.red-base{
    left:1%;
    top:1%;
    background:#e53935;
}

.blue-base{
    right:1%;
    top:1%;
    background:#1976d2;
}

.green-base{
    left:1%;
    top:35.5%;
    background:#16a34a;
}

.yellow-base{
    right:1%;
    top:35.5%;
    background:#eab308;
}

.purple-base{
    left:1%;
    bottom:1%;
    background:#9333ea;
}

.orange-base{
    right:1%;
    bottom:1%;
    background:#ea580c;
}

.base-inner{
    width:100%;
    height:calc(100% - 20px);
    background:rgba(255,255,255,.88);
    border-radius:8px;
    padding:7px;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:7px;
}

.home-slot{
    background:white;
    border:2px solid #333;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#333;
    font-size:10px;
    font-weight:bold;
}

/* TRACK */

.track{
    position:absolute;
    left:31%;
    top:3%;
    width:38%;
    height:94%;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(12,1fr);
    gap:1px;
    z-index:3;
}

.cell{
    background:#fff;
    border:1px solid #aaa;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.cell.safe{
    background:#fff4b5;
}

.cell.red-start{
    background:#ffc4c4;
}

.cell.blue-start{
    background:#c7ddff;
}

.cell.green-start{
    background:#c5f5cf;
}

.cell.yellow-start{
    background:#fff0a8;
}

.cell.purple-start{
    background:#e6c9ff;
}

.cell.orange-start{
    background:#ffd0ae;
}

.safe::after{
    content:"★";
    color:#888;
    font-size:13px;
}

/* SIDE TRACKS */

.side-track{
    position:absolute;
    left:3%;
    top:30%;
    width:94%;
    height:40%;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(14,1fr);
    grid-template-rows:repeat(3,1fr);
}

.side-cell{
    border:1px solid #aaa;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CENTER */

.center{
    position:absolute;
    left:36%;
    top:40%;
    width:28%;
    height:20%;
    background:linear-gradient(
        135deg,
        #ef4444,
        #2563eb,
        #22c55e,
        #eab308,
        #9333ea,
        #ea580c
    );
    border:5px solid #111;
    border-radius:50%;
    z-index:8;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
}

/* TOKENS */

.token{
    position:absolute;
    width:32px;
    height:32px;
    border-radius:50%;
    border:3px solid #111;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-weight:bold;
    font-size:11px;

    z-index:20;

    box-shadow:0 3px 7px #0008;
    cursor:pointer;

    transition:.25s;
}

.token:hover{
    transform:scale(1.15);
}

.movable{
    animation:movePulse .7s infinite alternate;
}

@keyframes movePulse{
    from{
        box-shadow:0 0 4px #fff;
        transform:scale(1);
    }
    to{
        box-shadow:0 0 18px #fff;
        transform:scale(1.18);
    }
}

.red-token{background:#d32f2f;}
.blue-token{background:#1565c0;}
.green-token{background:#15803d;}
.yellow-token{background:#ca8a04;}
.purple-token{background:#7e22ce;}
.orange-token{background:#c2410c;}

/* DICE */

.controls{
    margin-top:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
}

.dice{
    width:70px;
    height:70px;
    background:white;
    color:#111;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 5px 15px #0008;
}

.roll{
    border:0;
    background:#16a34a;
    color:white;
    padding:14px 24px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.roll:hover{
    background:#15803d;
}

.roll:disabled{
    background:#555;
    cursor:not-allowed;
}

.message{
    min-height:28px;
    margin-top:12px;
    font-size:17px;
    font-weight:bold;
}

.restart{
    margin-top:12px;
    border:0;
    background:#dc2626;
    color:white;
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
}

/* PLAYER COLORS */

.players{
    margin-top:14px;
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
}

.player{
    padding:7px 11px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.p-red{background:#d32f2f;}
.p-blue{background:#1565c0;}
.p-green{background:#15803d;}
.p-yellow{background:#ca8a04;}
.p-purple{background:#7e22ce;}
.p-orange{background:#c2410c;}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:6px;
    }

    h1{
        font-size:25px;
    }

    .board{
        border-width:4px;
    }

    .base{
        border-width:3px;
        padding:4px;
    }

    .base-title{
        font-size:8px;
        margin-bottom:2px;
    }

    .base-inner{
        padding:3px;
        gap:3px;
    }

    .home-slot{
        font-size:7px;
        border-width:1px;
    }

    .token{
        width:23px;
        height:23px;
        font-size:7px;
        border-width:2px;
    }

    .center{
        font-size:14px;
        border-width:3px;
    }

    .dice{
        width:60px;
        height:60px;
        font-size:32px;
    }

}

</style>
</head>

<body>

<div class="game">

<h1>🎲 SUPER LUDO</h1>

<div class="subtitle">
6 Player Ludo Game
</div>


<!-- PLAYER SELECT -->

<div class="setup">

<div class="setup-title">
👥 Select Number of Players
</div>

<div class="player-select">

<button onclick="choosePlayers(2)" id="n2">
2 Players
</button>

<button onclick="choosePlayers(3)" id="n3">
3 Players
</button>

<button onclick="choosePlayers(4)" id="n4" class="active">
4 Players
</button>

<button onclick="choosePlayers(5)" id="n5">
5 Players
</button>

<button onclick="choosePlayers(6)" id="n6">
6 Players
</button>

</div>

<button class="start" onclick="startGame()">
▶ Start Game
</button>

</div>


<div class="info">

<span>
Players: <b id="playerNumber">4</b>
</span>

<span>
Turn: <b id="turn">Red</b>
</span>

</div>


<!-- BOARD -->

<div class="board" id="board">


<!-- RED -->

<div class="base red-base">

<div class="base-title">🔴 RED</div>

<div class="base-inner">

<div class="home-slot">1</div>
<div class="home-slot">2</div>
<div class="home-slot">3</div>
<div class="home-slot">4</div>

</div>

</div>


<!-- BLUE -->

<div class="base blue-base">

<div class="base-title">🔵 BLUE</div>

<div class="base-inner">

<div class="home-slot">1</div>
<div class="home-slot">2</div>
<div class="home-slot">3</div>
<div class="home-slot">4</div>

</div>

</div>


<!-- GREEN -->

<div class="base green-base">

<div class="base-title">🟢 GREEN</div>

<div class="base-inner">

<div class="home-slot">1</div>
<div class="home-slot">2</div>
<div class="home-slot">3</div>
<div class="home-slot">4</div>

</div>

</div>


<!-- YELLOW -->

<div class="base yellow-base">

<div class="base-title">🟡 YELLOW</div>

<div class="base-inner">

<div class="home-slot">1</div>
<div class="home-slot">2</div>
<div class="home-slot">3</div>
<div class="home-slot">4</div>

</div>

</div>


<!-- PURPLE -->

<div class="base purple-base">

<div class="base-title">🟣 PURPLE</div>

<div class="base-inner">

<div class="home-slot">1</div>
<div class="home-slot">2</div>
<div class="home-slot">3</div>
<div class="home-slot">4</div>

</div>

</div>


<!-- ORANGE -->

<div class="base orange-base">

<div class="base-title">🟠 ORANGE</div>

<div class="base-inner">

<div class="home-slot">1</div>
<div class="home-slot">2</div>
<div class="home-slot">3</div>
<div class="home-slot">4</div>

</div>

</div>


<!-- SIDE TRACK -->

<div class="side-track" id="sideTrack"></div>


<!-- CENTER -->

<div class="center">
🏆 LUDO
</div>


</div>


<!-- CONTROLS -->

<div class="controls">

<div class="dice" id="dice">
🎲
</div>

<button class="roll" id="roll" onclick="rollDice()">
🎲 ROLL DICE
</button>

</div>


<div class="message" id="message">
Red's turn — Roll the dice!
</div>


<div class="players">

<div class="player p-red">🔴 Red</div>
<div class="player p-blue">🔵 Blue</div>
<div class="player p-green">🟢 Green</div>
<div class="player p-yellow">🟡 Yellow</div>
<div class="player p-purple">🟣 Purple</div>
<div class="player p-orange">🟠 Orange</div>

</div>


<button class="restart" onclick="startGame()">
🔄 Restart
</button>

</div>


<script>

/* ===================================
   PLAYERS
=================================== */

const COLORS = [

{
    name:"Red",
    css:"red",
    emoji:"🔴"
},

{
    name:"Blue",
    css:"blue",
    emoji:"🔵"
},

{
    name:"Green",
    css:"green",
    emoji:"🟢"
},

{
    name:"Yellow",
    css:"yellow",
    emoji:"🟡"
},

{
    name:"Purple",
    css:"purple",
    emoji:"🟣"
},

{
    name:"Orange",
    css:"orange",
    emoji:"🟠"
}

];


let playerCount = 4;

let activePlayers = [];

let current = 0;

let dice = 0;

let gameRunning = false;


/*
-1 = home
0-59 = board
60 = finished
*/

let pieces = [];


/* ===================================
   PLAYER SELECTION
=================================== */

function choosePlayers(number){

    playerCount = number;

    document
    .querySelectorAll(".player-select button")
    .forEach(button=>{
        button.classList.remove("active");
    });

    document
    .getElementById("n"+number)
    .classList.add("active");

    document
    .getElementById("playerNumber")
    .textContent = number;

}


/* ===================================
   START
=================================== */

function startGame(){

    activePlayers =
        COLORS.slice(0,playerCount);

    current = 0;

    dice = 0;

    gameRunning = true;

    pieces = [];

    activePlayers.forEach((player,index)=>{

        pieces[index] =
            [-1,-1,-1,-1];

    });

    document.getElementById("dice").textContent="🎲";

    document.getElementById("turn").textContent =
        activePlayers[0].name;

    document.getElementById("message").textContent =
        activePlayers[0].emoji +
        " " +
        activePlayers[0].name +
        "'s turn — Roll the dice!";

    document.getElementById("roll").disabled=false;

    drawPieces();

}


/* ===================================
   DICE
=================================== */

function rollDice(){

    if(!gameRunning){
        return;
    }

    dice =
        Math.floor(Math.random()*6)+1;

    document.getElementById("dice").textContent =
        dice;

    let player =
        activePlayers[current];

    let possible =
        getPossiblePieces();

    if(possible.length===0){

        document.getElementById("message").textContent =
            player.emoji +
            " " +
            player.name +
            " rolled " +
            dice +
            " — no move.";

        if(dice!==6){

            setTimeout(nextTurn,900);

        }

        return;
    }


    document.getElementById("message").textContent =
        player.emoji +
        " " +
        player.name +
        " rolled " +
        dice +
        " — choose a highlighted piece!";


    highlightPieces(possible);

}


/* ===================================
   POSSIBLE MOVES
=================================== */

function getPossiblePieces(){

    let result=[];

    pieces[current].forEach((position,index)=>{

        if(position===60){
            return;
        }

        if(position===-1){

            if(dice===6){
                result.push(index);
            }

        }
        else{

            if(position+dice<=60){
                result.push(index);
            }

        }

    });

    return result;

}


/* ===================================
   HIGHLIGHT
=================================== */

function highlightPieces(list){

    document
    .querySelectorAll(".token")
    .forEach(token=>{
        token.classList.remove("movable");
    });


    list.forEach(index=>{

        let token =
            document.querySelector(
                '.token[data-player="'+
                current+
                '"][data-piece="'+
                index+
                '"]'
            );

        if(token){

            token.classList.add("movable");

        }

    });


    /*
    If only one piece can move,
    move it automatically.
    */

    if(list.length===1){

        setTimeout(()=>{

            movePiece(list[0]);

        },600);

    }

}


/* ===================================
   MOVE
=================================== */

function movePiece(pieceIndex){

    let position =
        pieces[current][pieceIndex];


    /*
    HOME -> START
    */

    if(position===-1){

        if(dice!==6){
            return;
        }

        pieces[current][pieceIndex]=0;

    }
    else{

        pieces[current][pieceIndex]
            += dice;

    }


    let newPosition =
        pieces[current][pieceIndex];


    /*
    CAPTURE
    */

    capturePieces(newPosition);


    /*
    DRAW
    */

    drawPieces();


    /*
    WIN
    */

    if(
        pieces[current]
        .every(position=>position===60)
    ){

        document.getElementById("message").textContent =
            "🏆 " +
            activePlayers[current].emoji +
            " " +
            activePlayers[current].name +
            " WINS! 🎉";

        document.getElementById("roll").disabled=true;

        gameRunning=false;

        return;
    }


    /*
    SIX = EXTRA TURN
    */

    if(dice===6){

        document.getElementById("message").textContent =
            activePlayers[current].emoji +
            " " +
            activePlayers[current].name +
            " rolled 6 — Roll again!";

        document.getElementById("dice").textContent="🎲";

        return;

    }


    nextTurn();

}


/* ===================================
   CAPTURE
=================================== */

function capturePieces(position){

    if(position<0 || position>=60){
        return;
    }


    /*
    Six safe positions
    */

    const safe=[
        0,10,20,30,40,50
    ];


    if(safe.includes(position)){
        return;
    }


    activePlayers.forEach((player,index)=>{

        if(index===current){
            return;
        }


        pieces[index].forEach((enemyPosition,pieceIndex)=>{

            if(enemyPosition<0 ||
               enemyPosition===60){

                return;

            }


            /*
            Convert both players to
            the same 60-cell track.
            */

            let enemyReal =
                (enemyPosition +
                 index*10)%60;

            let myReal =
                (position +
                 current*10)%60;


            if(enemyReal===myReal){

                pieces[index][pieceIndex]=-1;

                document.getElementById("message").textContent =
                    activePlayers[current].emoji +
                    " " +
                    activePlayers[current].name +
                    " captured " +
                    activePlayers[index].emoji +
                    " " +
                    activePlayers[index].name +
                    "! 💥";

            }

        });

    });

}


/* ===================================
   NEXT TURN
=================================== */

function nextTurn(){

    current++;

    if(current>=activePlayers.length){

        current=0;

    }


    document.getElementById("turn").textContent =
        activePlayers[current].name;


    document.getElementById("turn").style.color =
        getColor(activePlayers[current].css);


    document.getElementById("dice").textContent="🎲";


    document.getElementById("message").textContent =
        activePlayers[current].emoji +
        " " +
        activePlayers[current].name +
        "'s turn — Roll the dice!";


    drawPieces();

}


/* ===================================
   DRAW TRACK
=================================== */

function createTrack(){

    const track =
        document.getElementById("sideTrack");

    track.innerHTML="";


    for(let i=0;i<42;i++){

        let cell =
            document.createElement("div");

        cell.className="side-cell";

        if(i%7===0){
            cell.textContent="★";
        }

        track.appendChild(cell);

    }

}


/* ===================================
   DRAW PIECES
=================================== */

function drawPieces(){

    document
    .querySelectorAll(".token")
    .forEach(token=>{
        token.remove();
    });


    activePlayers.forEach((player,playerIndex)=>{

        pieces[playerIndex].forEach(
            (position,pieceIndex)=>{

                if(position===60){
                    return;
                }

                createPiece(
                    playerIndex,
                    pieceIndex,
                    position
                );

            }
        );

    });

}


/* ===================================
   CREATE PIECE
=================================== */

function createPiece(
    playerIndex,
    pieceIndex,
    position
){

    let token =
        document.createElement("div");


    token.className =
        "token "+
        activePlayers[playerIndex].css+
        "-token";


    token.textContent =
        pieceIndex+1;


    token.dataset.player =
        playerIndex;


    token.dataset.piece =
        pieceIndex;


    /*
    HOME POSITION
    */

    if(position===-1){

        placeHomePiece(
            token,
            playerIndex,
            pieceIndex
        );

    }

    /*
    BOARD POSITION
    */

    else{

        placeBoardPiece(
            token,
            playerIndex,
            position
        );

    }


    document
    .getElementById("board")
    .appendChild(token);


    token.onclick=function(){

        if(playerIndex!==current){
            return;
        }


        let possible =
            getPossiblePieces();


        if(possible.includes(pieceIndex)){

            movePiece(pieceIndex);

        }

    };

}


/* ===================================
   HOME PIECE
=================================== */

function placeHomePiece(
    token,
    player,
    piece
){

    /*
    Six base positions
    */

    const locations=[

        [
            [5,7],
            [16,7],
            [5,18],
            [16,18]
        ],

        [
            [78,7],
            [89,7],
            [78,18],
            [89,18]
        ],

        [
            [5,40],
            [16,40],
            [5,51],
            [16,51]
        ],

        [
            [78,40],
            [89,40],
            [78,51],
            [89,51]
        ],

        [
            [5,72],
            [16,72],
            [5,83],
            [16,83]
        ],

        [
            [78,72],
            [89,72],
            [78,83],
            [89,83]
        ]

    ];


    let p =
        locations[player][piece];


    token.style.left =
        p[0]+"%";


    token.style.top =
        p[1]+"%";

}


/* ===================================
   BOARD PIECE
=================================== */

function placeBoardPiece(
    token,
    player,
    position
){

    /*
    Square-style 60 cell path.
    */

    const points =
        getTrackPoints();


    let index =
        (position +
         player*10)%60;


    let point =
        points[index];


    token.style.left =
        (point[0]-2)+"%";


    token.style.top =
        (point[1]-2)+"%";

}


/* ===================================
   TRACK POINTS
=================================== */

function getTrackPoints(){

    let points=[];


    /*
    Top
    */

    for(let x=20;x<=80;x+=5){

        points.push([x,20]);

    }


    /*
    Right
    */

    for(let y=25;y<=80;y+=5){

        points.push([80,y]);

    }


    /*
    Bottom
    */

    for(let x=75;x>=20;x-=5){

        points.push([x,80]);

    }


    /*
    Left
    */

    for(let y=75;y>=25;y-=5){

        points.push([20,y]);

    }


    /*
    Make exactly 60 positions
    */

    while(points.length<60){

        points.push(
            points[points.length%40]
        );

    }


    return points.slice(0,60);

}

        orange:"#f97316"

    };

}
