<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>6 Player Ludo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#111827;
    color:white;
    min-height:100vh;
    padding:15px;
}

.game{
    max-width:1100px;
    margin:auto;
    text-align:center;
}

h1{
    font-size:34px;
    margin:10px 0;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:15px;
}

/* PLAYER SELECT */

.setup{
    background:#1f2937;
    padding:18px;
    border-radius:15px;
    margin-bottom:18px;
}

.setup h2{
    margin-bottom:12px;
}

.player-buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.player-buttons button{
    padding:10px 17px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    background:#374151;
    color:white;
}

.player-buttons button.active{
    background:#22c55e;
}

.start-btn{
    margin-top:15px;
    padding:12px 25px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

/* GAME INFO */

.info{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.info-box{
    background:#1f2937;
    padding:10px 18px;
    border-radius:10px;
}

#turn{
    font-weight:bold;
}

/* BOARD */

.board{
    width:min(700px,95vw);
    height:min(700px,95vw);
    margin:auto;

    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);

    background:#f8fafc;

    border:7px solid #020617;
    border-radius:15px;

    overflow:hidden;

    box-shadow:0 15px 40px #0009;

    position:relative;
}

/* HOME AREAS */

.home{
    position:absolute;
    width:33.333%;
    height:33.333%;

    padding:12px;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:8px;
}

.home.red{
    left:0;
    top:0;
    background:#ef4444;
}

.home.blue{
    right:0;
    top:0;
    background:#3b82f6;
}

.home.green{
    left:0;
    bottom:0;
    background:#22c55e;
}

.home.yellow{
    right:0;
    bottom:0;
    background:#eab308;
}

.home.purple{
    left:33.333%;
    top:33.333%;
    background:#a855f7;
    width:16.667%;
    height:16.667%;
}

.home.orange{
    right:33.333%;
    bottom:33.333%;
    background:#f97316;
    width:16.667%;
    height:16.667%;
}

.home-slot{
    background:white;
    border-radius:50%;
    border:3px solid #111827;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#111;
    font-weight:bold;
    font-size:11px;
}

/* CENTER */

.center{
    position:absolute;

    left:33.333%;
    top:33.333%;

    width:33.333%;
    height:33.333%;

    background:
    conic-gradient(
        #ef4444 0deg 60deg,
        #3b82f6 60deg 120deg,
        #22c55e 120deg 180deg,
        #eab308 180deg 240deg,
        #a855f7 240deg 300deg,
        #f97316 300deg 360deg
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:bold;

    border:3px solid #111827;
}

/* PATH */

.path{
    position:absolute;

    left:16.667%;
    top:16.667%;

    width:66.666%;
    height:66.666%;

    display:grid;

    grid-template-columns:repeat(11,1fr);
    grid-template-rows:repeat(11,1fr);

    pointer-events:none;
}

.path-cell{
    border:1px solid #94a3b8;
    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:9px;
    color:#64748b;
}

/* TRACK COLORS */

.red-cell{
    background:#fecaca;
}

.blue-cell{
    background:#bfdbfe;
}

.green-cell{
    background:#bbf7d0;
}

.yellow-cell{
    background:#fef08a;
}

.purple-cell{
    background:#e9d5ff;
}

.orange-cell{
    background:#fed7aa;
}

/* TOKENS */

.token{
    width:72%;
    height:72%;

    border-radius:50%;

    border:3px solid #111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    position:absolute;

    z-index:20;

    box-shadow:0 3px 7px #0008;

    transition:.2s;
}

.token:hover{
    transform:scale(1.18);
}

.token.movable{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.15);
    }
}

.red-token{
    background:#dc2626;
}

.blue-token{
    background:#2563eb;
}

.green-token{
    background:#16a34a;
}

.yellow-token{
    background:#ca8a04;
}

.purple-token{
    background:#9333ea;
}

.orange-token{
    background:#ea580c;
}

/* CONTROLS */

.controls{
    margin-top:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:15px;
    flex-wrap:wrap;
}

.dice{
    width:75px;
    height:75px;

    background:white;
    color:#111;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;
    font-weight:bold;

    box-shadow:0 5px 15px #0007;
}

.roll{
    padding:14px 25px;

    background:#22c55e;
    color:white;

    border:0;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.roll:hover{
    background:#16a34a;
}

.roll:disabled{
    background:#475569;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    min-height:28px;
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

/* PLAYER LIST */

.players{
    margin-top:15px;

    display:flex;
    justify-content:center;

    gap:7px;
    flex-wrap:wrap;
}

.player{
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
}

.red{
    background:#dc2626;
}

.blue{
    background:#2563eb;
}

.green{
    background:#16a34a;
}

.yellow{
    background:#ca8a04;
}

.purple{
    background:#9333ea;
}

.orange{
    background:#ea580c;
}

/* RESTART */

.restart{
    margin-top:15px;

    padding:10px 20px;

    border:0;
    border-radius:8px;

    background:#ef4444;
    color:white;

    cursor:pointer;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:7px;
    }

    h1{
        font-size:25px;
    }

    .board{
        border-width:4px;
    }

    .home{
        padding:5px;
        gap:3px;
    }

    .home-slot{
        border-width:2px;
        font-size:7px;
    }

    .token{
        border-width:2px;
        font-size:7px;
    }

    .center{
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="game">

<h1>🎲 6 PLAYER LUDO</h1>

<div class="subtitle">
Play Ludo with your friends
</div>


<!-- PLAYER SETUP -->

<div class="setup">

<h2>Select Players</h2>

<div class="player-buttons">

<button onclick="selectPlayers(2)" id="p2">2 Players</button>
<button onclick="selectPlayers(3)" id="p3">3 Players</button>
<button onclick="selectPlayers(4)" id="p4" class="active">4 Players</button>
<button onclick="selectPlayers(5)" id="p5">5 Players</button>
<button onclick="selectPlayers(6)" id="p6">6 Players</button>

</div>

<button class="start-btn" onclick="startGame()">
Start Game
</button>

</div>


<!-- INFO -->

<div class="info">

<div class="info-box">
Players:
<span id="playerCount">4</span>
</div>

<div class="info-box">
Turn:
<span id="turn">Red</span>
</div>

</div>


<!-- BOARD -->

<div class="board" id="board">


<!-- HOMES -->

<div class="home red">

<div class="home-slot">R1</div>
<div class="home-slot">R2</div>
<div class="home-slot">R3</div>
<div class="home-slot">R4</div>

</div>


<div class="home blue">

<div class="home-slot">B1</div>
<div class="home-slot">B2</div>
<div class="home-slot">B3</div>
<div class="home-slot">B4</div>

</div>


<div class="home green">

<div class="home-slot">G1</div>
<div class="home-slot">G2</div>
<div class="home-slot">G3</div>
<div class="home-slot">G4</div>

</div>


<div class="home yellow">

<div class="home-slot">Y1</div>
<div class="home-slot">Y2</div>
<div class="home-slot">Y3</div>
<div class="home-slot">Y4</div>

</div>


<div class="home purple">

<div class="home-slot">P1</div>
<div class="home-slot">P2</div>
<div class="home-slot">P3</div>
<div class="home-slot">P4</div>

</div>


<div class="home orange">

<div class="home-slot">O1</div>
<div class="home-slot">O2</div>
<div class="home-slot">O3</div>
<div class="home-slot">O4</div>

</div>


<!-- CENTER -->

<div class="center">
🏆
</div>


<!-- PATH -->

<div class="path" id="path"></div>

</div>


<!-- CONTROLS -->

<div class="controls">

<div class="dice" id="dice">
🎲
</div>

<button class="roll" id="rollButton" onclick="rollDice()">
Roll Dice
</button>

</div>


<div class="message" id="message">
Red's turn. Roll the dice!
</div>


<!-- PLAYERS -->

<div class="players">

<div class="player red">🔴 Red</div>
<div class="player blue">🔵 Blue</div>
<div class="player green">🟢 Green</div>
<div class="player yellow">🟡 Yellow</div>
<div class="player purple">🟣 Purple</div>
<div class="player orange">🟠 Orange</div>

</div>


<button class="restart" onclick="startGame()">
🔄 Restart Game
</button>

</div>


<script>

/* =========================
   PLAYER DATA
========================= */

const allPlayers = [

{
    name:"Red",
    color:"red",
    emoji:"🔴",
    start:0
},

{
    name:"Blue",
    color:"blue",
    emoji:"🔵",
    start:10
},

{
    name:"Green",
    color:"green",
    emoji:"🟢",
    start:20
},

{
    name:"Yellow",
    color:"yellow",
    emoji:"🟡",
    start:30
},

{
    name:"Purple",
    color:"purple",
    emoji:"🟣",
    start:40
},

{
    name:"Orange",
    color:"orange",
    emoji:"🟠",
    start:50
}

];


/* =========================
   GAME VARIABLES
========================= */

let numberOfPlayers = 4;

let players = [];

let currentPlayer = 0;

let diceValue = 0;

let gameStarted = false;


/*
Each player has 4 tokens.

-1 = HOME
0+ = board position
60 = FINISHED
*/

let tokens = [];


/* =========================
   SELECT PLAYERS
========================= */

function selectPlayers(number){

    numberOfPlayers = number;

    document
    .querySelectorAll(".player-buttons button")
    .forEach(button=>{
        button.classList.remove("active");
    });

    document
    .getElementById("p"+number)
    .classList.add("active");

    document
    .getElementById("playerCount")
    .innerText = number;

}


/* =========================
   START GAME
========================= */

function startGame(){

    players = allPlayers.slice(0,numberOfPlayers);

    currentPlayer = 0;

    diceValue = 0;

    gameStarted = true;

    tokens = [];

    players.forEach((player,index)=>{

        tokens[index] = [-1,-1,-1,-1];

    });

    document.getElementById("dice").innerText = "🎲";

    document.getElementById("turn").innerText =
        players[0].name;

    document.getElementById("message").innerText =
        players[0].name + "'s turn. Roll the dice!";

    document.getElementById("rollButton").disabled = false;

    drawTokens();

}


/* =========================
   DICE
========================= */

function rollDice(){

    if(!gameStarted) return;

    diceValue =
        Math.floor(Math.random()*6)+1;

    document.getElementById("dice").innerText =
        diceValue;

    let player = players[currentPlayer];

    document.getElementById("message").innerText =
        player.emoji +
        " " +
        player.name +
        " rolled " +
        diceValue +
        "!";

    /*
    Check movable tokens
    */

    let movable = getMovableTokens();

    if(movable.length === 0){

        document.getElementById("message").innerText =
            player.name +
            " has no possible move.";

        if(diceValue !== 6){

            setTimeout(nextTurn,900);

        }

        return;
    }

    /*
    Highlight movable tokens
    */

    highlightMovable(movable);

}


/* =========================
   MOVABLE TOKENS
========================= */

function getMovableTokens(){

    let result = [];

    let playerTokens =
        tokens[currentPlayer];

    playerTokens.forEach((position,index)=>{

        /*
        Token in HOME

        Only 6 can bring it out
        */

        if(position === -1){

            if(diceValue === 6){

                result.push(index);

            }

            return;

        }


        /*
        Finished token
        */

        if(position === 60){

            return;

        }


        /*
        Normal movement
        */

        if(position + diceValue <= 60){

            result.push(index);

        }

    });

    return result;

}


/* =========================
   HIGHLIGHT
========================= */

function highlightMovable(list){

    document
    .querySelectorAll(".token")
    .forEach(token=>{

        token.classList.remove("movable");

    });


    list.forEach(index=>{

        let token =
            document.querySelector(
                `.token[data-player="${currentPlayer}"][data-token="${index}"]`
            );

        if(token){

            token.classList.add("movable");

        }

    });


    /*
    For easy testing,
    automatically move after short delay
    */

    if(list.length === 1){

        setTimeout(()=>{

            moveToken(list[0]);

        },500);

    }

}


/* =========================
   MOVE TOKEN
========================= */

function moveToken(tokenIndex){

    let playerTokens =
        tokens[currentPlayer];

    let oldPosition =
        playerTokens[tokenIndex];


    /*
    HOME -> BOARD
    */

    if(oldPosition === -1){

        if(diceValue !== 6){

            return;

        }

        playerTokens[tokenIndex] = 0;

    }

    else{

        playerTokens[tokenIndex] += diceValue;

    }


    let newPosition =
        playerTokens[tokenIndex];


    /*
    CAPTURE
    */

    captureOpponents(
        currentPlayer,
        newPosition
    );


    /*
    WIN CHECK
    */

    if(checkWinner(currentPlayer)){

        document.getElementById("message").innerText =
            "🏆 " +
            players[currentPlayer].name +
            " WINS THE GAME! 🎉";

        document.getElementById("rollButton").disabled =
            true;

        return;

    }


    drawTokens();


    /*
    6 = another turn
    */

    if(diceValue === 6){

        document.getElementById("message").innerText =
            players[currentPlayer].name +
            " rolled 6! Roll again.";

        document.getElementById("dice").innerText =
            "🎲";

        return;

    }


    nextTurn();

}


/* =========================
   CAPTURE
========================= */

function captureOpponents(playerIndex,position){

    if(position < 0 || position >= 60){

        return;

    }


    /*
    Safe starting positions
    */

    const safePositions =
        [0,10,20,30,40,50];


    if(safePositions.includes(
        (position +
        players[playerIndex].start)%60
    )){

        return;

    }


    players.forEach((player,index)=>{

        if(index === playerIndex){

            return;

        }


        tokens[index].forEach((tokenPosition,tokenIndex)=>{

            if(tokenPosition === -1 ||
               tokenPosition === 60){

                return;

            }


            let realPosition =
                (players[index].start +
                tokenPosition)%60;


            let myRealPosition =
                (players[playerIndex].start +
                position)%60;


            if(realPosition === myRealPosition){

                tokens[index][tokenIndex] = -1;

                document.getElementById("message").innerText =
                    players[playerIndex].name +
                    " captured " +
                    players[index].name +
                    "'s token! 💥";

            }

        });

    });

}


/* =========================
   WINNER
========================= */

function checkWinner(playerIndex){

    return tokens[playerIndex]
        .every(position=>position === 60);

}


/* =========================
   NEXT TURN
========================= */

function nextTurn(){

    currentPlayer++;

    if(currentPlayer >= players.length){

        currentPlayer = 0;

    }


    document.getElementById("turn").innerText =
        players[currentPlayer].name;


    document.getElementById("turn").style.color =
        getColor(players[currentPlayer].color);


    document.getElementById("dice").innerText =
        "🎲";


    document.getElementById("message").innerText =
        players[currentPlayer].emoji +
        " " +
        players[currentPlayer].name +
        "'s turn. Roll the dice!";


    drawTokens();

}


/* =========================
   COLOR
========================= */

function getColor(color){

    const colors = {

        red:"#dc2626",

        blue:"#2563eb",

        green:"#16a34a",

        yellow:"#eab308",

        purple:"#9333ea",

        orange:"#ea580c"

    };

    return colors[color];

}


/* =========================
   DRAW TOKENS
========================= */

function drawTokens(){

    /*
    Remove old tokens
    */

    document
    .querySelectorAll(".token")
    .forEach(token=>{
        token.remove();
    });


    players.forEach((player,playerIndex)=>{

        tokens[playerIndex].forEach(
            (position,tokenIndex)=>{

                if(position === 60){

                    return;

                }


                createToken(
                    playerIndex,
                    tokenIndex,
                    position
                );

            }
        );

    });

}


/* =========================
   CREATE TOKEN
========================= */

function createToken(
    playerIndex,
    tokenIndex,
    position
){

    let token =
        document.createElement("div");

    token.className =
        "token " +
        players[playerIndex].color +
        "-token";


    token.innerText =
        tokenIndex+1;


    token.dataset.player =
        playerIndex;


    token.dataset.token =
        tokenIndex;


    /*
    HOME POSITION
    */

    if(position === -1){

        placeHomeToken(
            token,
            playerIndex,
            tokenIndex
        );

    }

    else{

        placeBoardToken(
            token,
            playerIndex,
            position
        );

    }


    document
    .getElementById("board")
    .appendChild(token);

}


/* =========================
   HOME TOKEN
========================= */

function placeHomeToken(
    token,
    playerIndex,
    tokenIndex
){

    const positions = [

        [
            [4,4],
            [10,4],
            [4,10],
            [10,10]
        ],

        [
            [4,52],
            [10,52],
            [4,58],
            [10,58]
        ],

        [
            [4,4],
            [10,4],
            [4,10],
            [10,10]
        ],

        [
            [78,4],
            [84,4],
            [78,10],
            [84,10]
        ],

        [
            [42,42],
            [46,42],
            [42,46],
            [46,46]
        ],

        [
            [54,54],
            [58,54],
            [54,58],
            [58,58]
        ]

    ];


    let pos =
        positions[playerIndex][tokenIndex];


    token.style.left =
        pos[0] + "%";


    token.style.top =
        pos[1] + "%";


    token.style.width =
        "7%";


    token.style.height =
        "7%";


    token.onclick = ()=>{

        if(
            playerIndex === currentPlayer &&
            diceValue === 6
        ){

            moveToken(tokenIndex);

        }

    };

}


/* =========================
   BOARD TOKEN
========================= */

function placeBoardToken(
    token,
    playerIndex,
    position
){

    /*
    Create circular path
    */

    const angle =
        ((position % 60)/60) *
        Math.PI * 2 -
        Math.PI/2;


    const radius = 30;


    const centerX = 50;
    const centerY = 50;


    let x =
        centerX +
        Math.cos(angle)*radius;


    let y =
        centerY +
        Math.sin(angle)*radius;


    token.style.left =
        (x-3.5) + "%";


    token.style.top =
        (y-3.5) + "%";


    token.style.width =
        "7%";


    token.style.height =
        "7%";


    token.onclick = ()=>{

        if(playerIndex !== currentPlayer){

            return;

        }


        let movable =
            getMovableTokens();


        if(movable.includes(tokenIndexFromToken(token))){

            moveToken(
                tokenIndexFromToken(token)
            );

        }

    };

}


/* =========================
   TOKEN INDEX
========================= */

function tokenIndexFromToken(token){

    return parseInt(
        token.dataset.token
    );

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.code === "Space"){

            rollDice();

        }

    }
);


/* =========================
   START
========================= */

selectPlayers(4);

startGame();

</script>

</body>
</html>
